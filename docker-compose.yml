services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEETING_TOKEN_TTL_SECONDS=7200
      - MEETING_CLOSED_TTL_SECONDS=7200
    depends_on:
      - redis

  transcription:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "worker.transcription_worker"]
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRANSCRIBE_MODEL=gpt-4o-mini-transcribe
      - TRANSCRIBE_LANGUAGE=pt
      - AUDIO_SCAN_INTERVAL_SECONDS=1.0
      - MEETING_IDLE_TIMEOUT_SECONDS=30
      - MAX_ACTIVE_MEETINGS=3
    depends_on:
      - redis

  insights:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "worker.insights_worker"]
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INSIGHTS_MODEL=gpt-4o-mini
      - INSIGHTS_DEDUP_TTL_SECONDS=120
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
