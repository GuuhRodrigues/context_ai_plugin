services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./observability/output:/app/observability/output
    depends_on:
      - redis

  transcription:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.src.workers.transcription_worker"]
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis

  insights:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "backend.src.workers.insights_worker"]
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
